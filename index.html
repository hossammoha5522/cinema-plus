<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما بلس - مشاهدة بدون إعلانات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding-bottom: 50px;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background-color: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #e11d48;
            cursor: pointer;
        }

        .logo span {
            color: #fff;
        }

        .user-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        /* قسم المشغل */
        .player-section {
            display: none;
            margin: 20px 8%;
            background-color: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .servers-bar {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            overflow-x: auto;
        }

        .server-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .server-btn.active {
            background-color: #e11d48;
            color: #fff;
            border-color: #e11d48;
        }

        .video-container {
            width: 100%;
            height: 400px;
            background-color: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-controls-bar {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .current-movie-title {
            font-size: 20px;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .act-btn {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .act-btn.active-like {
            background-color: #16a34a;
            border-color: #16a34a;
        }

        .act-btn.active-dislike {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        /* شبكة الأفلام */
        .section-title {
            margin: 30px 8% 15px;
            font-size: 22px;
            font-weight: 700;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 0 8%;
        }

        .movie-card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-6px);
        }

        .movie-poster {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }

        /* طبقة التحميل */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(225, 29, 72, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .movie-card.loading .loading-overlay {
            opacity: 1;
        }

        /* نافذة الحساب */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            border: 1px solid #334155;
        }

        .modal-content h3 {
            margin-bottom: 15px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
        }

        .modal-content button {
            width: 100%;
            padding: 10px;
            background-color: #e11d48;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">سينما<span>بلس</span></div>
        <button class="user-btn" id="accountBtn" onclick="openModal()">تسجيل الدخول</button>
    </header>

    <!-- قسم المشغل -->
    <section class="player-section" id="playerSection">
        <div class="servers-bar">
            <span style="align-self: center; font-size: 13px; color: #64748b; margin-left: 10px;">السيرفرات:</span>
            <button class="server-btn active" onclick="switchServer(this)">سيرفر VIP (VK)</button>
            <button class="server-btn" onclick="switchServer(this)">سيرفر 2 (FHD)</button>
            <button class="server-btn" onclick="switchServer(this)">سيرفر 3 (HD)</button>
        </div>

        <div class="video-container">
            <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" playsinline webkit-playsinline></iframe>
        </div>

        <div class="player-controls-bar">
            <div class="current-movie-title" id="displayTitle">عنوان الفيلم</div>
            <div class="action-buttons">
                <button class="act-btn" id="likeBtn" onclick="toggleLike()">
                    👍 <span id="likeCount">124</span>
                </button>
                <button class="act-btn" id="dislikeBtn" onclick="toggleDislike()">
                    👎 <span id="dislikeCount">12</span>
                </button>
            </div>
        </div>
    </section>

    <h2 class="section-title">الأفلام الأكثر مشاهدة</h2>

    <div class="movies-grid" id="moviesGrid">
        <p style="color:#94a3b8; text-align:center; grid-column: 1/-1;">جاري تحميل الأفلام من السيرفر...</p>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3>تسجيل الدخول</h3>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم">
            <input type="password" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
        </div>
    </div>

    <script>
        const SUPABASE_API_URL = 'https://pemxbkwlbwuedabsvpzf.supabase.co/rest/v1/movies';
        const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlbXhia3dsYnd1ZWRhYnN2cHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjI3NTcsImV4cCI6MjEwNjQ5ODc1N30.LEpbExsYNJSUmKe2JQfGbBGb_5wO3NdSJ5-Zr02kTBE';

        let likes = 124;
        let dislikes = 12;
        let isLiked = false;
        let isDisliked = false;

        // جلب البيانات من Supabase
        async function fetchMovies() {
            const grid = document.getElementById('moviesGrid');
            try {
                const response = await fetch(SUPABASE_API_URL, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error('خطأ في استجابة السيرفر');
                }

                const movies = await response.json();

                if (movies.length === 0) {
                    grid.innerHTML = '<p style="color:#94a3b8; text-align:center; grid-column: 1/-1;">لا توجد أفلام مضافة حتى الآن في قاعدة البيانات.</p>';
                    return;
                }

                grid.innerHTML = '';
                movies.forEach(movie => {
                    grid.innerHTML += `
                        <div class="movie-card" onclick="selectMovie(this, '${movie.title}', '${movie.video_url}')">
                            <div class="loading-overlay">جاري التشغيل...</div>
                            <img class="movie-poster" src="${movie.poster}" alt="${movie.title}">
                            <div class="movie-info">
                                <div class="movie-title">${movie.title}</div>
                                <div class="movie-meta">
                                    <span>${movie.year}</span>
                                    <span style="color: #f59e0b;">★ ${movie.rating}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Fetch Error:', err);
                grid.innerHTML = '<p style="color:#e11d48; text-align:center; grid-column: 1/-1;">تعذر تحميل الأفلام، تأكد من إعدادات جدول Supabase.</p>';
            }
        }

        window.onload = fetchMovies;

        function selectMovie(cardElement, movieTitle, videoUrl) {
            cardElement.classList.add('loading');

            setTimeout(() => {
                cardElement.classList.remove('loading');
                
                if (!videoUrl) {
                    alert('عذراً، هذا الفيلم غير متوفر حالياً.');
                    return;
                }

                const player = document.getElementById('playerSection');
                player.style.display = 'block';

                document.getElementById('displayTitle').innerText = movieTitle;
                
                const iframe = document.getElementById('mainPlayer');
                iframe.src = videoUrl;
                
                likes = Math.floor(Math.random() * 500) + 100;
                dislikes = Math.floor(Math.random() * 30);
                isLiked = false;
                isDisliked = false;
                updateReactionUI();

                player.scrollIntoView({ behavior: 'smooth' });
            }, 800);
        }

        function switchServer(btn) {
            let btns = document.querySelectorAll('.server-btn');
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleLike() {
            if (isLiked) {
                likes--;
                isLiked = false;
            } else {
                likes++;
                isLiked = true;
                if (isDisliked) {
                    dislikes--;
                    isDisliked = false;
                }
            }
            updateReactionUI();
        }

        function toggleDislike() {
            if (isDisliked) {
                dislikes--;
                isDisliked = false;
            } else {
                dislikes++;
                isDisliked = true;
                if (isLiked) {
                    likes--;
                    isLiked = false;
                }
            }
            updateReactionUI();
        }

        function updateReactionUI() {
            document.getElementById('likeCount').innerText = likes;
            document.getElementById('dislikeCount').innerText = dislikes;
            
            const likeBtn = document.getElementById('likeBtn');
            const dislikeBtn = document.getElementById('dislikeBtn');

            if(isLiked) likeBtn.classList.add('active-like');
            else likeBtn.classList.remove('active-like');

            if(isDisliked) dislikeBtn.classList.add('active-dislike');
            else dislikeBtn.classList.remove('active-dislike');
        }

        function openModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function login() {
            let name = document.getElementById('usernameInput').value;
            if (name.trim() !== "") {
                document.getElementById('accountBtn').innerText = 'مرحباً، ' + name;
                document.getElementById('loginModal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
